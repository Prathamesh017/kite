# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'
vars:
  GREETING: Welcome to the KI . A Minimal Coding Agent!

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true
  run:
     desc: Run the KI Agent
     cmds:  
       - go run ./cmd/main.go
     silent: true
  debug:
     desc: Run the KI Agent under the debugger (attach with "Attach to kite")
     cmds:
       - ~/go/bin/dlv debug ./cmd --headless --listen=127.0.0.1:2345 --api-version=2
     silent: true
  test:
     desc: Run all tests
     cmds:
       - go test ./...
     silent: true